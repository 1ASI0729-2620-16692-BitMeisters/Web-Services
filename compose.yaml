services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: fleetsafe
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d fleetsafe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
