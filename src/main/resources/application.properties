# Spring Application Name
spring.application.name=FleetSafe Platform

# Spring DataSource Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fleetsafe}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA Configuration
spring.jpa.show-sql=true

# Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=com.bitmeisters.fleetsafe.platform.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy

# Spring Message Source Configuration
spring.messages.fallback-to-system-locale=false
